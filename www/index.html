<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2d5a27">
  <title>مسبحة الاستغفار</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="screens">

    <!-- ===================== المسبحة ===================== -->
    <section id="tab-home" class="screen active" data-i18n-aria="tab_home">
      <header class="top">
        <button id="streakChip" class="chip streak" type="button" hidden>🔥 <span></span></button>
        <button id="dhikrChip" class="chip dhikr" type="button" aria-haspopup="dialog">
          <span id="dhikrChipText">أستغفر الله</span> <span class="caret">▾</span>
        </button>
      </header>

      <div id="homeCards"></div>

      <div class="counter-wrap">
        <div class="ring-box">
          <svg class="ring" viewBox="0 0 220 220" aria-hidden="true">
            <circle class="ring-track" cx="110" cy="110" r="100"></circle>
            <circle id="ringBar" class="ring-bar" cx="110" cy="110" r="100"></circle>
          </svg>
          <button id="tapBtn" class="tap-btn" type="button" data-i18n-aria="tap_label">
            <span id="tapText" class="tap-text">أستغفر الله</span>
            <span id="tapMeaning" class="tap-meaning"></span>
            <span id="tapCount" class="tap-count">٠</span>
          </button>
        </div>
        <p id="progressLine" class="progress-line"></p>
        <div class="home-actions">
          <button id="fullscreenBtn" class="btn ghost" type="button" data-i18n="fullscreen"></button>
        </div>
      </div>

      <article id="dailyText" class="card quote"></article>
    </section>

    <!-- ===================== الإحصائيات ===================== -->
    <section id="tab-stats" class="screen" data-i18n-aria="stats_title">
      <header class="top"><h2 data-i18n="stats_title"></h2>
        <select id="statsDhikr" class="select small" data-i18n-aria="stats_dhikr_label"></select>
      </header>
      <div class="segmented" id="statsRange" role="tablist">
        <button data-r="week" class="on" type="button" data-i18n="range_week"></button>
        <button data-r="month" type="button" data-i18n="range_month"></button>
        <button data-r="year" type="button" data-i18n="range_year"></button>
      </div>
      <div class="card chart-card">
        <div class="chart-head">
          <button id="chartPrev" class="icon-btn" type="button" data-i18n-aria="prev">›</button>
          <div><div id="chartTitle" class="chart-title"></div><div id="chartSub" class="chart-sub"></div></div>
          <button id="chartNext" class="icon-btn" type="button" data-i18n-aria="next">‹</button>
        </div>
        <div id="chart" class="chart"></div>
      </div>
      <div id="tiles" class="tiles"></div>
      <div class="card">
        <h3 data-i18n="last_12_months"></h3>
        <div id="heatmap" class="heatmap-wrap"></div>
        <div class="heat-legend"><span data-i18n="less"></span><i class="h0"></i><i class="h1"></i><i class="h2"></i><i class="h3"></i><i class="h4"></i><span data-i18n="more"></span></div>
      </div>
      <div class="card">
        <div class="row-between"><h3 data-i18n="badges"></h3><span id="achCount" class="muted"></span></div>
        <div id="achievements" class="badges"></div>
      </div>
      <button id="shareProgressBtn" class="btn primary block" type="button" data-i18n="share_progress"></button>
    </section>

    <!-- ===================== الفضل ===================== -->
    <section id="tab-virtue" class="screen" data-i18n-aria="virtue_title">
      <header class="top"><h2 data-i18n="virtue_title"></h2></header>
      <div class="card">
        <h3 data-i18n="benefits_title"></h3>
        <div id="benefits" class="benefits"></div>
      </div>
      <article class="card sayyid">
        <h3 data-i18n="sayyid_title"></h3>
        <p id="sayyidText" class="quran"></p>
        <p id="sayyidMeaning" class="meaning-text"></p>
        <p id="sayyidVirtue" class="virtue"></p>
        <p id="sayyidVirtueMeaning" class="meaning-text"></p>
        <p id="sayyidRef" class="ref"></p>
      </article>
      <div class="card"><h3 data-i18n="from_quran"></h3><div id="ayatList" class="texts"></div></div>
      <div class="card"><h3 data-i18n="from_sunnah"></h3><div id="hadithList" class="texts"></div></div>
    </section>

    <!-- ===================== الإعدادات ===================== -->
    <section id="tab-settings" class="screen" data-i18n-aria="settings_title">
      <header class="top"><h2 data-i18n="settings_title"></h2></header>

      <div class="card">
        <h3 data-i18n="goal_title"></h3>
        <div id="goalChips" class="chips"></div>
        <div class="row">
          <input id="goalCustom" class="input" type="number" inputmode="numeric" min="1" max="100000" data-i18n-ph="goal_other">
          <button id="goalCustomBtn" class="btn" type="button" data-i18n="save"></button>
        </div>
        <p class="hint" data-i18n="goal_hint"></p>
      </div>

      <div class="card">
        <div class="row-between">
          <h3 data-i18n="rem_title"></h3>
          <label class="toggle"><input type="checkbox" id="remEnabled"><span class="slider"></span></label>
        </div>
        <div id="remBody">
          <div id="exactRow" class="warn-row" hidden>
            <span data-i18n="exact_row"></span>
            <button id="exactBtn" class="btn small" type="button" data-i18n="allow"></button>
          </div>

          <div class="field">
            <span class="label" data-i18n="sound_type"></span>
            <div class="segmented" id="soundMode">
              <button data-v="voice" type="button" data-i18n="sound_voice"></button>
              <button data-v="vibrate" type="button" data-i18n="sound_vibrate"></button>
              <button data-v="silent" type="button" data-i18n="sound_silent"></button>
            </div>
          </div>

          <div class="field">
            <span class="label" data-i18n="times_title"></span>
            <div class="row">
              <input type="time" id="timeInput" class="input" value="05:00">
              <button id="addTimeBtn" class="btn primary" type="button" data-i18n="add"></button>
            </div>
            <ul id="timeList" class="pill-list"></ul>
          </div>

          <div class="field">
            <div class="row-between">
              <span class="label" data-i18n="interval_title"></span>
              <label class="toggle"><input type="checkbox" id="intOn"><span class="slider"></span></label>
            </div>
            <div id="intBody" class="sub">
              <select id="intMin" class="select"></select>
              <div class="row window-row">
                <label><span data-i18n="from"></span> <input type="time" id="winStart" class="input"></label>
                <label><span data-i18n="to"></span> <input type="time" id="winEnd" class="input"></label>
              </div>
              <p class="hint" data-i18n="quiet_hint"></p>
            </div>
          </div>

          <div class="field">
            <div class="row-between">
              <span class="label" data-i18n="prayers_title"></span>
              <label class="toggle"><input type="checkbox" id="prOn"><span class="slider"></span></label>
            </div>
            <div id="prBody" class="sub">
              <div class="row">
                <select id="prCity" class="select" data-i18n-aria="city"></select>
                <select id="prOffset" class="select" data-i18n-aria="after_adhan"></select>
              </div>
              <div id="prWhich" class="chips"></div>
              <p id="prToday" class="hint"></p>
            </div>
          </div>

          <div class="row-between line">
            <span data-i18n="stop_goal"></span>
            <label class="toggle"><input type="checkbox" id="stopGoal"><span class="slider"></span></label>
          </div>
          <div class="row-between line">
            <span data-i18n="weekly_summary"></span>
            <label class="toggle"><input type="checkbox" id="weeklyOn"><span class="slider"></span></label>
          </div>
          <button id="testNotifBtn" class="btn block" type="button" data-i18n="test_rem"></button>
          <button id="batteryBtn" class="btn ghost small block" type="button" data-i18n="battery_btn"></button>
          <p id="schedInfo" class="hint center"></p>
        </div>
      </div>

      <div class="card" id="shareCard">
        <h3 data-i18n="share_title"></h3>
        <p class="muted" data-i18n="share_desc"></p>
        <div id="refStats" class="ref-stats" hidden>
          <div><b id="refPeople">٠</b><span data-i18n="ref_people"></span></div>
          <div><b id="refTotal">٠</b><span data-i18n="ref_istighfar"></span></div>
        </div>
        <button id="shareAppBtn" class="btn primary block" type="button" data-i18n="share_app"></button>
        <div id="myCodeRow" class="code-row" hidden><span data-i18n="my_code"></span> <b id="myCode"></b></div>
        <details id="enterCodeBox" class="details" hidden>
          <summary data-i18n="have_code"></summary>
          <div class="row">
            <input id="codeInput" class="input code" maxlength="12" data-i18n-ph="code_example" autocapitalize="characters">
            <button id="codeBtn" class="btn" type="button" data-i18n="confirm"></button>
          </div>
        </details>
        <div id="shareAnonRow" class="row-between line" hidden>
          <span data-i18n="share_anon"></span>
          <label class="toggle"><input type="checkbox" id="shareAnon"><span class="slider"></span></label>
        </div>
      </div>

      <div class="card" id="accountCard" hidden>
        <h3 data-i18n="account_title"></h3>
        <div id="guestBox">
          <p class="muted" data-i18n="guest_desc"></p>
          <button id="googleBtn" class="btn social google block" type="button" hidden><b>G</b> <span data-i18n="google_signin"></span></button>
          <button id="facebookBtn" class="btn social facebook block" type="button" hidden><b>f</b> <span data-i18n="facebook_signin"></span></button>
        </div>
        <div id="userBox" hidden>
          <div class="user-line"><span id="userName"></span><span id="userProvider" class="muted"></span></div>
          <p id="lastSync" class="hint"></p>
          <div class="row">
            <button id="syncBtn" class="btn" type="button" data-i18n="sync_now"></button>
            <button id="signOutBtn" class="btn" type="button" data-i18n="sign_out"></button>
          </div>
          <button id="deleteAccBtn" class="btn danger-text block" type="button" data-i18n="delete_account"></button>
        </div>
      </div>

      <div class="card">
        <h3 data-i18n="language"></h3>
        <select id="langSelect" class="select block-select"></select>
      </div>

      <div class="card">
        <h3 data-i18n="tasbih_title"></h3>
        <div class="field">
          <span class="label" data-i18n="vibrate_every"></span>
          <div class="segmented" id="cycleMode">
            <button data-v="33" type="button" data-num="33"></button>
            <button data-v="100" type="button" data-num="100"></button>
            <button data-v="0" type="button" data-i18n="none"></button>
          </div>
        </div>
        <div class="field">
          <span class="label" data-i18n="theme"></span>
          <div class="segmented" id="themeMode">
            <button data-v="auto" type="button" data-i18n="theme_auto"></button>
            <button data-v="light" type="button" data-i18n="theme_light"></button>
            <button data-v="dark" type="button" data-i18n="theme_dark"></button>
          </div>
        </div>
        <button id="widgetBtn" class="btn primary block" type="button" hidden data-i18n="widget_btn"></button>
        <div class="row">
          <button id="resetTodayBtn" class="btn danger" type="button" data-i18n="reset_today"></button>
          <button id="resetAllBtn" class="btn danger-text" type="button" data-i18n="reset_all"></button>
        </div>
      </div>

      <p class="about"><span data-i18n="app_name"></span> <span id="appVersion"></span><span id="aboutSep"> · </span><a id="privacyLink" href="#" data-i18n="privacy"></a></p>
    </section>
  </main>

  <nav class="tabbar" data-i18n-aria="nav_label">
    <button data-tab="home" class="on" type="button"><i>📿</i><span data-i18n="tab_home"></span></button>
    <button data-tab="stats" type="button"><i>📊</i><span data-i18n="tab_stats"></span></button>
    <button data-tab="virtue" type="button"><i>📖</i><span data-i18n="tab_virtue"></span></button>
    <button data-tab="settings" type="button"><i>⚙️</i><span data-i18n="tab_settings"></span></button>
  </nav>

  <!-- وضع اللمس الكامل -->
  <div id="fullscreen" class="fullscreen" hidden>
    <button id="fsClose" class="fs-close" type="button" data-i18n-aria="close">✕</button>
    <div class="fs-inner">
      <div id="fsText" class="fs-text"></div>
      <div id="fsCount" class="fs-count">٠</div>
      <div id="fsSub" class="fs-sub"></div>
      <div id="fsMeaning" class="fs-meaning"></div>
      <div class="fs-hint" data-i18n="fs_hint"></div>
    </div>
  </div>

  <!-- نوافذ -->
  <div id="sheet" class="sheet-overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <h3 id="sheetTitle"></h3>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="modal" class="modal-overlay" hidden>
    <div class="modal-box" role="alertdialog" aria-modal="true">
      <div id="modalTitle" class="modal-title"></div>
      <div id="modalMsg" class="modal-msg"></div>
      <div class="modal-actions">
        <button id="modalCancel" type="button" class="btn" data-i18n="cancel"></button>
        <button id="modalOk" type="button" class="btn primary" data-i18n="confirm"></button>
      </div>
    </div>
  </div>

  <div id="celebrate" class="celebrate" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/lang/ar.js"></script>
  <script src="js/lang/en.js"></script>
  <script src="js/lang/id.js"></script>
  <script src="js/lang/tr.js"></script>
  <script src="js/lang/ur.js"></script>
  <script src="js/lang/bn.js"></script>
  <script src="js/lang/fa.js"></script>
  <script src="js/lang/ha.js"></script>
  <script src="js/vendor/adhan.min.js"></script>
  <script src="js/content.js"></script>
  <script src="js/store.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/widget.js"></script>
  <script src="js/share.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
